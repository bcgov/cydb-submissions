# Copy this file to secret.yaml and DO NOT commit secret.yaml.
#
# ORIGIN is OPTIONAL when the Pod sits behind an OpenShift Route doing TLS
# termination — adapter-node will derive the origin from the Route's
# x-forwarded-proto and x-forwarded-host headers (configured by the
# Containerfile via PROTOCOL_HEADER/HOST_HEADER env vars). Set it explicitly
# only if you want to pin the canonical URL (useful when more than one
# hostname could reach the pod).
apiVersion: v1
kind: Secret
metadata:
  name: cydb-submissions-secrets
type: Opaque
stringData:
  BETTER_AUTH_SECRET: replace-with-32+-char-secret
  # ORIGIN: https://cydb.example.gov.bc.ca
  ADMIN_BOOTSTRAP_EMAIL: admin@example.gov.bc.ca
  ADMIN_BOOTSTRAP_PASSWORD: change-on-first-login
  # Phase 3 — Kong + MS Document Intelligence. Uncomment once provisioned
  # by the BC Gov API Platform team. Until then leave OCR_PROVIDER=stub
  # in the Deployment env.
  # KONG_TOKEN_URL: https://api.gov.bc.ca/oauth2/token
  # KONG_CLIENT_ID: <provisioned by API platform team>
  # KONG_CLIENT_SECRET: <provisioned by API platform team>
  # Phase 3 — BC Gov DI backend (alternative to kong-ms-di). Switch
  # OCR_PROVIDER=bcgov-di in the Deployment once this key is in place.
  # The base URL and workflow slug live in the Deployment env (non-secret);
  # only the API key is secret.
  # BCGOV_DI_API_KEY: <group-scoped key issued by AI Adoption team>
  # Phase 3 — CHES (Common Hosted Email Service). Switch
  # MAIL_TRANSPORT=ches in the Deployment once these are provisioned.
  # CHES_BASE_URL + CHES_TOKEN_URL live in the Deployment env (non-secret);
  # only the OAuth client_id/client_secret are secret.
  # CHES_CLIENT_ID: <Keycloak service-account client id>
  # CHES_CLIENT_SECRET: <Keycloak service-account client secret>
  # Phase 3 — halted-queue alert recipients (comma-separated).
  # Empty = log-only (no mail attempt).
  # OCR_ALERT_RECIPIENTS: ops@example.gov.bc.ca
