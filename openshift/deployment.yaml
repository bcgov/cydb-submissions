apiVersion: apps/v1
kind: Deployment
metadata:
  name: cydb-submissions
  labels:
    app: cydb-submissions
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cydb-submissions
  template:
    metadata:
      labels:
        app: cydb-submissions
    spec:
      # fsGroup ensures the PVC mounts at /data/db and /data/attachments are
      # owned by the supplemental group the container runs in, so the
      # arbitrary OpenShift UID can write the SQLite file and attachment
      # subdirs. The Restricted SCC would normally pick this up automatically,
      # but stating it makes the intent explicit and works on platforms with
      # stricter defaults.
      securityContext:
        fsGroup: 0
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/cydb/cydb-submissions:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cydb-submissions-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: /data/db/local.db
            - name: ATTACHMENTS_DIR
              value: /data/attachments
            # Phase 3 OCR worker — disabled by default; set to "1" to start.
            # OCR_PROVIDER:
            #   "stub"       — dev/CI; reads fixtures from tests/fixtures/ocr
            #   "kong-ms-di" — BC Gov Kong gateway → Azure DI (OAuth2 client_creds)
            #   "bcgov-di"   — BC Gov AI Adoption DI backend (x-api-key, workflow-driven)
            # See secret.example.yaml for the credentials each provider needs.
            - name: OCR_WORKER_ENABLED
              value: "0"
            - name: OCR_PROVIDER
              value: "stub"
            - name: OCR_MAX_CONCURRENCY
              value: "1"
            - name: OCR_MAX_ATTEMPTS
              value: "3"
            - name: OCR_FAILURE_BREAKER
              value: "4"
            - name: OCR_POLL_INTERVAL_MS
              value: "1000"
            - name: OCR_MODEL_ID
              value: "prebuilt-read"
            - name: AZURE_DI_API_VERSION
              value: "2024-11-30"
            - name: KONG_BASE_URL
              value: "https://api.gov.bc.ca/document-intelligence"
            # BC Gov DI backend — non-secret base URL + workflow live here;
            # BCGOV_DI_API_KEY comes from cydb-submissions-secrets.
            - name: BCGOV_DI_BASE_URL
              value: "https://bcgov-di-test-backend-fd34fb-test.apps.silver.devops.gov.bc.ca"
            - name: BCGOV_DI_WORKFLOW_SLUG
              value: "ocr-only-minimal"
            # Halted-queue alerts.
            # MAIL_TRANSPORT:
            #   "log"  — default, writes alerts to pino (no mail sent)
            #   "ches" — BC Gov Common Hosted Email Service (web API + OAuth2)
            #   "smtp" — direct SMTP (currently a stub, throws on send)
            # Switch to "ches" once CHES_CLIENT_ID / CHES_CLIENT_SECRET
            # are in cydb-submissions-secrets.
            - name: MAIL_TRANSPORT
              value: "log"
            - name: OCR_ALERT_FROM
              value: "cydb-noreply@gov.bc.ca"
            # CHES non-secret config. The Keycloak token URL is realm-
            # scoped; the BC Gov SSO loginproxy host is correct for most
            # gov workloads — override per environment as needed.
            - name: CHES_BASE_URL
              value: "https://ches.api.gov.bc.ca/api/v1"
            - name: CHES_TOKEN_URL
              value: "https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token"
            # BC Gov SSO (Keycloak OIDC) — non-secret issuer URL. The
            # client id + secret come from cydb-submissions-secrets.
            # Set per environment via the configmap-*.yaml overlays
            # (loginproxy host changes between dev/test/prod).
            - name: SSO_ISSUER_URL
              value: "https://loginproxy.gov.bc.ca/auth/realms/standard"
            # adapter-node's default body-size limit is 512K, which truncates
            # any upload above that long before the in-app MAX_UPLOAD_BYTES
            # check runs. Sized to the form's 25 MiB cap with headroom for
            # form fields. Lower this for stricter intake or to protect
            # against memory pressure under load.
            - name: BODY_SIZE_LIMIT
              value: "27000000"
          volumeMounts:
            - name: db
              mountPath: /data/db
            - name: attachments
              mountPath: /data/attachments
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: cydb-submissions-db
        - name: attachments
          persistentVolumeClaim:
            claimName: cydb-submissions-attachments
