# Copy this file to secret.yaml and DO NOT commit secret.yaml.
#
# ORIGIN is OPTIONAL when the Pod sits behind an OpenShift Route doing TLS
# termination — adapter-node will derive the origin from the Route's
# x-forwarded-proto and x-forwarded-host headers (configured by the
# Containerfile via PROTOCOL_HEADER/HOST_HEADER env vars). Set it explicitly
# only if you want to pin the canonical URL (useful when more than one
# hostname could reach the pod).
apiVersion: v1
kind: Secret
metadata:
  name: cydb-submissions-secrets
type: Opaque
stringData:
  BETTER_AUTH_SECRET: replace-with-32+-char-secret
  # ORIGIN: https://cydb.example.gov.bc.ca
  ADMIN_BOOTSTRAP_EMAIL: admin@example.gov.bc.ca
  ADMIN_BOOTSTRAP_PASSWORD: change-on-first-login
