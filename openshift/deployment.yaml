apiVersion: apps/v1
kind: Deployment
metadata:
  name: cydb-submissions
  labels:
    app: cydb-submissions
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cydb-submissions
  template:
    metadata:
      labels:
        app: cydb-submissions
    spec:
      # fsGroup ensures the PVC mount at /data is owned by the supplemental
      # group the container runs in, so the arbitrary OpenShift UID can
      # write the SQLite file and attachment subdirs. The Restricted SCC
      # would normally pick this up automatically, but stating it makes the
      # intent explicit and works on platforms with stricter defaults.
      securityContext:
        fsGroup: 0
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/cydb/cydb-submissions:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cydb-submissions-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: /data/local.db
            - name: ATTACHMENTS_DIR
              value: /data/attachments
            # Phase 3 OCR worker — disabled by default; set to "1" to start.
            # Switch OCR_PROVIDER to "kong-ms-di" once the Kong creds are in
            # the cydb-submissions-secrets Secret (see secret.example.yaml).
            - name: OCR_WORKER_ENABLED
              value: "0"
            - name: OCR_PROVIDER
              value: "stub"
            - name: OCR_MAX_CONCURRENCY
              value: "1"
            - name: OCR_MAX_ATTEMPTS
              value: "3"
            - name: OCR_FAILURE_BREAKER
              value: "4"
            - name: OCR_POLL_INTERVAL_MS
              value: "1000"
            - name: OCR_MODEL_ID
              value: "prebuilt-read"
            - name: AZURE_DI_API_VERSION
              value: "2024-11-30"
            - name: KONG_BASE_URL
              value: "https://api.gov.bc.ca/document-intelligence"
            # Halted-queue alerts — log-only until SMTP relay is confirmed.
            - name: MAIL_TRANSPORT
              value: "log"
            - name: OCR_ALERT_FROM
              value: "cydb-noreply@gov.bc.ca"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cydb-submissions-data
